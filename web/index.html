<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>跨屏输入</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317324d'/%3E%3Cpath d='M32 12a9 9 0 0 0-9 9v12a9 9 0 0 0 18 0V21a9 9 0 0 0-9-9zm-16 20a16 16 0 0 0 32 0M32 48v8M24 56h16' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>跨屏输入</h1>
        <p><span class="product-subtitle">手机输入，电脑同步</span><span class="subtitle-separator"> · </span><span id="connectionText">正在连接电脑</span></p>
        <p class="network-hint">手机和电脑需连接同一个 Wi-Fi</p>
      </div>
      <span id="statusDot" class="status-dot connecting" aria-hidden="true"></span>
    </header>

    <section class="text-entry">
      <div class="input-wrap">
        <textarea id="imeInput" rows="7" aria-label="输入内容" placeholder="连接电脑后，点这里开始输入" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" disabled></textarea>
        <button id="clearButton" class="clear-button" type="button" title="清空输入框" aria-label="清空输入框" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      <p id="activity" class="activity">打字、语音和退格都会自动同步到电脑</p>

      <div class="key-actions">
        <button id="adjustButton" class="action-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
          <span><strong>调整方向</strong><small>Ctrl+Enter</small></span>
        </button>
        <button id="newlineButton" class="action-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10 4 15l5 5"></path><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
          <span><strong>换行</strong><small>Shift+Enter</small></span>
        </button>
        <button id="sendButton" class="action-button primary" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
          <span><strong>发送</strong><small>Enter</small></span>
        </button>
      </div>

      <div class="attachment-actions">
        <button id="imageButton" class="attachment-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>
          <span>发送图片</span>
        </button>
        <button id="fileButton" class="attachment-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span>发送文件</span>
        </button>
      </div>
      <input id="imageInput" class="hidden-input" type="file" accept="image/*">
      <input id="fileInput" class="hidden-input" type="file">
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
